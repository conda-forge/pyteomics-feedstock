schema_version: 1

context:
  name: pyteomics
  version: "5.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyteomics-${{ version }}.tar.gz
  sha256: 234a4d361d1a144247caa6b5fc35836eb3a40153bcd6f575c5b95c3bd49de21d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - lxml

tests:
  - python:
      imports:
        - pyteomics
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: A framework for proteomics data analysis.
  license: Apache-2.0 AND SL
  license_file:
    - LICENSE
    - NOTICE
  homepage: http://pyteomics.readthedocs.io

extra:
  recipe-maintainers:
    - hadim
