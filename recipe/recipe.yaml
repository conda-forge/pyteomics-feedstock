schema_version: 1

context:
  name: pyteomics
  version: "5.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyteomics-${{ version }}.tar.gz
  sha256: 2b29b37d3d1e6359204df51a3b5f9a682e4a9f0049925fdc52e4887a5cbfcc2c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - lxml

tests:
  - python:
      imports:
        - pyteomics
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: A framework for proteomics data analysis.
  license: Apache-2.0 AND SL
  license_file: LICENSE
  homepage: http://pyteomics.readthedocs.io

extra:
  recipe-maintainers:
    - hadim
