schema_version: 1

context:
  name: pyteomics
  version: "5.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyteomics-${{ version }}.tar.gz
  sha256: 89670f1512caa7fce5a269f3dc8d5b3856ef02f161fd2abc77155adb0bbe4a48

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - lxml

tests:
  - python:
      imports:
        - pyteomics
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: A framework for proteomics data analysis.
  license: Apache-2.0 AND SL
  license_file: LICENSE
  homepage: http://pyteomics.readthedocs.io

extra:
  recipe-maintainers:
    - hadim
